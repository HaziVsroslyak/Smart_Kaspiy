name: smart-caspian-transit
services:
  backend:
    environment:
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      DATABASE_PATH: /app/artifacts/voyages.sqlite3
      APP_ORIGINS: ${APP_ORIGINS:-https://localhost}
      FORWARDED_ALLOW_IPS: 172.30.11.10
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    volumes:
      - backend_data:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
  frontend:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ''
    depends_on:
      backend:
        condition: service_healthy
  gateway:
    image: caddy:2.10-alpine
    networks:
      default:
        ipv4_address: 172.30.11.10
    ports:
      - "127.0.0.1:443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
volumes:
  backend_data:
  caddy_data:
  caddy_config:
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.11.0/24
